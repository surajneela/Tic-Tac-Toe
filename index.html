<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Permanent+Marker&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <!-- Game Setup Modal -->
  <div id="setupModal" class="setup-modal">
    <div class="setup-content">
      <h2 class="setup-title">🎮 Game Setup</h2>
      <p class="setup-subtitle">How many games would you like to play?</p>
      <div class="setup-input-group">
        <label for="numGames" class="setup-label">Number of Games:</label>
        <input type="number" id="numGames" class="setup-input" min="1" max="99" value="3">
      </div>
      <button id="startGameButton" class="setup-button">Start Playing!</button>
    </div>
  </div>

  <div class="container mt-5">
    <h1 class="text-center mb-4">Tic-Tac-Toe</h1>
    <div class="game-progress">
      <span id="gameProgress">Game 1 of 3</span>
    </div>
    <div class="scoreboard">
      <div class="score-item">
        <div class="player-label">Player X</div>
        <div class="score-value" id="scoreX">0</div>
      </div>
      <div class="score-divider">VS</div>
      <div class="score-item">
        <div class="player-label">Player O</div>
        <div class="score-value" id="scoreO">0</div>
      </div>
    </div>
    <div class="game-info text-center mb-3">
      <h3 id="status">Player X's turn</h3>
    </div>
    <div class="game-board">
      <div class="cell" data-cell></div>
      <div class="cell" data-cell></div>
      <div class="cell" data-cell></div>
      <div class="cell" data-cell></div>
      <div class="cell" data-cell></div>
      <div class="cell" data-cell></div>
      <div class="cell" data-cell></div>
      <div class="cell" data-cell></div>
      <div class="cell" data-cell></div>
    </div>
    <div class="text-center mt-4 button-group">
      <button id="nextGameButton" class="btn btn-primary" style="display: none;">Next Game</button>
      <button id="restartButton" class="btn btn-success">Restart Tournament</button>
      <button id="exitButton" class="btn btn-danger">Exit</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/src/confetti.js"></script>
  <script src="/src/script.js"></script>
</body>

</html>
